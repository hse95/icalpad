<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCalPad</title>
<meta name="description" content="iCalPad: a free-form math worksheet with units, symbolic math, plots and pictures. Runs entirely in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* iCalPad. Layout idea: an engineer's calculation pad on a desk. Chrome stays quiet;
   the sheet carries the character (title block, margin rule, answers in blue pen, OK/NG stamps). */
:root {
  --desk: #E4EAE2; --chrome: #F3F6F0; --paper: #FBFCF8; --ink: #17262B; --ink2: #50615D; --ink3: #84938E;
  --rule: #BFD0C4; --rule2: #DDE7DF; --pen: #1C3FB8; --pen-soft: #E6EBFB; --ok: #1B7A46; --ng: #BE3028; --warn: #9A5F06;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300;
  --ui: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --cond: "Barlow Semi Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  --math: "STIX Two Text", "STIX Two Math", "Cambria Math", Cambria, "Times New Roman", serif;
  --shadow: 0 1px 2px rgba(23, 38, 43, .08), 0 8px 24px rgba(23, 38, 43, .10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0E1416; --chrome: #141C1F; --paper: #182124; --ink: #E3ECE7; --ink2: #A7B6B1; --ink3: #71807C;
    --rule: #33454A; --rule2: #243235; --pen: #A3B9FF; --pen-soft: #1D2947; --ok: #5FCB8F; --ng: #FF857D; --warn: #E3B04B;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0E1416; --chrome: #141C1F; --paper: #182124; --ink: #E3ECE7; --ink2: #A7B6B1; --ink3: #71807C;
  --rule: #33454A; --rule2: #243235; --pen: #A3B9FF; --pen-soft: #1D2947; --ok: #5FCB8F; --ng: #FF857D; --warn: #E3B04B;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--desk); color: var(--ink); font: 15px/1.45 var(--ui); -webkit-text-size-adjust: 100%; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 6px; padding: 7px 12px; background: var(--chrome); border-bottom: 1px solid var(--rule); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 19px/1 var(--cond); letter-spacing: .01em; margin-right: 8px; white-space: nowrap; }
.brand svg { width: 24px; height: 24px; }
.grp { display: flex; align-items: center; gap: 2px; }
.sep { width: 1px; align-self: stretch; background: var(--rule); margin: 4px 6px; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px; background: none; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--rule2); }
.btn[aria-pressed="true"], .btn[aria-expanded="true"] { background: var(--rule2); }
.btn.line { border-color: var(--rule); background: var(--paper); }
.btn.line:hover { border-color: var(--ink3); }
.btn.solid { background: var(--pen); color: var(--paper); }
.btn.solid:hover { filter: brightness(1.1); background: var(--pen); }
.btn.icon { padding: 0; width: 34px; justify-content: center; }
.btn:disabled { opacity: .4; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--rule); background: var(--paper); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); }
.chip.on .dot { background: var(--ok); } .chip.busy .dot { background: var(--warn); animation: pulse 1s infinite; } .chip.bad .dot { background: var(--ng); }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- body: side panel + desk ---------- */
.main { display: flex; min-height: 0; min-width: 0; }
.side { width: 292px; flex: none; background: var(--chrome); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.side.closed { display: none; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--rule); }
.tab { border: 0; background: none; padding: 7px 10px 8px; font-weight: 500; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pen); }
.pane { overflow: auto; padding: 10px; flex: 1; min-height: 0; }
.side h2 { font: 600 15px/1 var(--cond); margin: 0; padding: 14px 14px 10px; border-bottom: 1px solid var(--rule); }
.search { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); margin-bottom: 8px; }
.cat { font: 600 13px/1.2 var(--cond); color: var(--ink2); margin: 14px 4px 4px; }
.cat:first-of-type { margin-top: 6px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; }
.item:hover { background: var(--rule2); }
.item b { display: block; font-weight: 500; }
.item > span { display: block; font-size: 13px; color: var(--ink2); line-height: 1.3; }
.soon { margin: 16px 4px 4px; padding-top: 12px; border-top: 1px dashed var(--rule); font-size: 13px; color: var(--ink2); }
.soon div { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.soon i { font-style: normal; padding: 2px 9px; border: 1px dashed var(--rule); border-radius: 12px; color: var(--ink3); }
.out-h { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 5px; font-weight: 500; }
.out-h.l2 { padding-left: 18px; font-weight: 400; } .out-h.l3 { padding-left: 28px; font-weight: 400; color: var(--ink2); }
.out-h:hover, .var:hover { background: var(--rule2); }
.var { display: flex; width: 100%; justify-content: space-between; gap: 10px; align-items: baseline; border: 0; background: none; padding: 3px 8px; border-radius: 5px; text-align: left; }
.var .mx { font-size: 16px; } .var > span:last-child { color: var(--ink2); font-size: 13px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { color: var(--ink3); font-size: 13px; padding: 4px 8px; }

.desk { flex: 1; overflow: auto; padding: 22px 22px 80px; min-width: 0; scroll-behavior: smooth; }
.sheet { width: 900px; max-width: none; margin: 0 auto; background: var(--paper); box-shadow: var(--shadow); border-radius: 3px; position: relative; }

/* title block, as on a calculation sheet */
.tblock { display: grid; grid-template-columns: minmax(0, 1fr) 150px 130px 64px; border-bottom: 2px solid var(--rule); }
.tblock label { display: block; padding: 8px 12px 9px; border-left: 1px solid var(--rule2); min-width: 0; }
.tblock label:first-child { border-left: 0; padding-left: 26px; }
.tblock small { display: block; font: 500 12px/1.2 var(--cond); color: var(--ink3); }
.tblock input { width: 100%; border: 0; background: none; padding: 2px 0 0; font-size: 15px; min-width: 0; }
.tblock input:focus { outline: none; box-shadow: 0 1px 0 var(--pen); }
.tblock .title { font: 600 23px/1.2 var(--cond); }

/* the page: a free-form canvas with a faint dot grid */
.rgs { position: relative; min-height: 520px; }
.rgs.free { cursor: crosshair; background-image: radial-gradient(circle, var(--rule) 0.9px, transparent 1.3px); background-size: 16px 16px; background-position: 2px 6px; }
.rgs.flow { padding: 10px 0 6px; }
.cross { position: absolute; width: 17px; height: 17px; margin: -8px 0 0 -8px; pointer-events: none; z-index: 3; }
.cross::before, .cross::after { content: ""; position: absolute; background: var(--pen); }
.cross::before { left: 8px; top: 0; width: 1.5px; height: 17px; } .cross::after { top: 8px; left: 0; height: 1.5px; width: 17px; }
.blank { position: absolute; left: 56px; top: 18px; color: var(--ink3); pointer-events: none; }
.rgs.flow .blank { position: static; padding: 14px 16px; }

/* regions */
.rg { position: relative; }
.free .rg { position: absolute; cursor: default; }
.rg .body { min-width: 0; }
.free .rg .body { padding: 2px 8px; border: 1px solid transparent; border-radius: 6px; }
.free .rg:hover .body { border-color: var(--rule); }
.free .rg.on { z-index: 6; }
.free .rg.on .body { border-color: var(--pen); background: var(--paper); box-shadow: 0 0 0 3px var(--pen-soft); }
.free .rg.drag { z-index: 7; opacity: .9; }
.free .rg.drag .body { border-color: var(--pen); border-style: dashed; background: var(--paper); }
.free .rg.bad .body { border-color: var(--ng); }
.flow .rg .body { padding: 3px 14px 3px 12px; border-left: 3px solid transparent; }
.flow .rg.on .body { border-left-color: var(--pen); background: linear-gradient(90deg, var(--pen-soft), transparent 70%); }
.flow .rg.bad .body { border-left-color: var(--ng); }
.hdl { position: absolute; left: -24px; top: 3px; width: 23px; height: 27px; border: 1px solid var(--rule); background: var(--paper); border-radius: 5px; color: var(--ink2); display: none; place-items: center; padding: 0; cursor: grab; touch-action: none; z-index: 2; }
.hdl svg.ic { width: 15px; height: 15px; fill: currentColor; stroke: none; }
.free .rg:hover .hdl, .rg.on .hdl, .hdl:focus-visible { display: grid; }
.hdl:hover { color: var(--ink); border-color: var(--ink3); }
.flow .hdl { left: auto; right: 8px; top: 5px; cursor: pointer; }
.rz { position: absolute; right: -4px; bottom: -4px; width: 15px; height: 15px; border-right: 3px solid var(--pen); border-bottom: 3px solid var(--pen); border-radius: 0 0 4px 0; cursor: nwse-resize; display: none; touch-action: none; }
.rz.w { top: 50%; bottom: auto; right: -5px; width: 7px; height: 30px; border: 0; background: var(--pen); border-radius: 4px; cursor: ew-resize; transform: translateY(-50%); }
.free .rg:hover .rz, .free .rg.on .rz { display: block; }
.view { min-height: 32px; padding: 3px 0; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 10px; }
.free .rg.math .view { flex-wrap: nowrap; white-space: nowrap; }
.flow .view { overflow-x: auto; overflow-y: hidden; cursor: text; }
.view .raw { font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink2); white-space: pre-wrap; }
.view .ph, .rg.text .ph { color: var(--ink3); }
.sub { color: var(--ink2); }
.res { color: var(--pen); cursor: pointer; border-radius: 4px; }
.res:hover { background: var(--pen-soft); }
.pend { color: var(--ink3); font-size: 13px; }
.stamp { font: 600 13px/1 var(--cond); letter-spacing: .08em; padding: 4px 8px 3px; border: 2px solid currentColor; border-radius: 3px; transform: rotate(-4deg); display: inline-block; }
.stamp.ok { color: var(--ok); } .stamp.ng { color: var(--ng); }
.edit { display: none; padding: 2px 0 6px; }
.rg.on .edit { display: block; }
.free .rg .edit { position: absolute; left: -1px; top: calc(100% + 6px); width: max(400px, 100%); max-width: 600px; padding: 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); cursor: default; }
.free .rg.text .edit { position: static; width: auto; max-width: none; padding: 0; border: 0; box-shadow: none; }
.src { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font: 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.src:focus, textarea.tsrc:focus, .pform input:focus, .pform select:focus { outline: none; border-color: var(--pen); box-shadow: 0 0 0 3px var(--pen-soft); }
.keys { display: flex; gap: 4px; padding-top: 6px; overflow-x: auto; scrollbar-width: none; }
.free .keys { flex-wrap: wrap; overflow: visible; }
.keys::-webkit-scrollbar { display: none; }
.key { flex: none; min-width: 34px; height: 30px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); font: 15px/1 var(--math); }
.key:hover { border-color: var(--ink3); }
.key.w { font: 500 13px/1 var(--ui); color: var(--ink2); }
.msg { font-size: 13.5px; color: var(--ng); padding: 0 0 6px; }
.free .msg { max-width: 400px; min-width: 240px; white-space: normal; padding: 0 0 3px; }
.msg.note { color: var(--ink2); }
.msg button { border: 0; background: none; color: var(--pen); text-decoration: underline; padding: 0; font-weight: 500; }

.rg.text .view { display: block; padding: 3px 0; overflow: visible; }
.rg.text.on .view { display: none; }
.rg.text h1 { font: 600 27px/1.2 var(--cond); margin: 4px 0 2px; text-wrap: balance; }
.rg.text h2 { font: 600 19px/1.25 var(--cond); margin: 4px 0 0; padding-bottom: 3px; border-bottom: 1px solid var(--rule2); text-wrap: balance; }
.rg.text h3 { font: 600 16px/1.3 var(--cond); margin: 4px 0 0; }
.rg.text p { margin: 2px 0; max-width: 72ch; color: var(--ink2); }
.rg.text ul { margin: 3px 0; padding-left: 20px; color: var(--ink2); max-width: 72ch; }
.rg.text code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--rule2); padding: 1px 5px; border-radius: 4px; color: var(--ink); overflow-wrap: anywhere; }
.rg.text .mx { font-size: 1.1em; color: var(--ink); }
.flow .rg.text h1 { margin-top: 12px; } .flow .rg.text h2 { margin-top: 14px; }
textarea.tsrc { display: block; width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); resize: none; overflow: hidden; line-height: 1.45; }

/* pictures and sketches */
:root { --a0: #D92D20; --a1: #1C3FB8; --a3: #E08A00; --a4: #1B7A46; }
.fig { position: relative; display: block; line-height: 0; border-radius: 4px; overflow: hidden; margin: 4px 0; }
.fig.sk { border: 1px dashed var(--rule); background: var(--paper); }
.fig img { width: 100%; height: 100%; display: block; object-fit: fill; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.fig svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fig.tool { cursor: crosshair; touch-action: none; }
.pen-mode .rg.on .fig { touch-action: none; }   /* once a stylus is used, it draws on the selected picture instead of scrolling */
.fig, .hdl, .rgs.free { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.rgs.free input, .rgs.free textarea { -webkit-user-select: text; user-select: text; }
button { touch-action: manipulation; }
.btn > svg, .key > svg { pointer-events: none; }
.fig .lbl { position: absolute; z-index: 3; width: 140px; height: 28px; padding: 0 6px; border: 1px solid var(--pen); border-radius: 5px; background: var(--paper); font: 14px var(--ui); line-height: 1; }
.itools { align-items: center; flex-wrap: wrap; gap: 6px; }
.rg.on .itools { display: flex; }
.free .rg .itools { width: max-content; max-width: 560px; }
.itools .btn { height: 32px; padding: 0 9px; font-size: 14px; }
.itools .btn[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.cols { display: inline-flex; gap: 5px; padding: 0 4px; }
.col { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--paper); background: var(--sw); box-shadow: 0 0 0 1px var(--rule); padding: 0; }
.col.on { box-shadow: 0 0 0 2px var(--ink); }

/* plots */
.pwrap { position: relative; margin: 6px 0 2px; }
.pwrap canvas { display: block; width: 100%; height: 240px; touch-action: pan-y; }
.tip { position: absolute; pointer-events: none; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); padding: 6px 9px; font-size: 13px; line-height: 1.5; white-space: nowrap; z-index: 2; font-variant-numeric: tabular-nums; }
.tip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.tip b { font-weight: 500; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 2px 0 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 16px; flex: 1; min-width: 0; }
.legend > span { display: inline-flex; align-items: center; gap: 7px; }
.legend > span > i { width: 14px; height: 3px; border-radius: 2px; flex: none; }
.legend .mx { font-size: 16px; }
.anim { display: flex; align-items: center; gap: 8px; }
.anim .btn { height: 30px; }
.anim input[type=range] { width: 150px; accent-color: var(--pen); }
.anim output { font-size: 13px; color: var(--ink2); min-width: 86px; font-variant-numeric: tabular-nums; }
.pform { flex-wrap: wrap; gap: 6px 10px; align-items: flex-end; padding: 4px 0 8px; }
.rg.on .pform { display: flex; }
.free .rg .pform { width: 560px; max-width: 560px; }
.pform label { display: grid; gap: 2px; font-size: 12.5px; color: var(--ink2); }
.pform input, .pform select { height: 34px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-width: 0; }
.pform select { font: inherit; }
.pform .wide { flex: 1 1 260px; } .pform .wide input { width: 100%; }
.pform .nar input { width: 78px; } .pform .tiny input { width: 58px; }

.credit { padding: 10px 16px 12px; border-top: 1px solid var(--rule2); font-size: 13px; color: var(--ink2); display: none; }
a { color: var(--pen); }

/* ---------- status bar ---------- */
.status { display: flex; gap: 18px; align-items: center; padding: 4px 12px; background: var(--chrome); border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
.status .grow { overflow: hidden; text-overflow: ellipsis; text-align: right; }

/* ---------- menus, dialogs, toasts ---------- */
.menu { position: fixed; z-index: 30; min-width: 220px; max-width: min(360px, calc(100vw - 16px)); max-height: min(70vh, 560px); overflow: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 5px; }
.menu .mi { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; }
.menu .mi:hover, .menu .mi:focus-visible { background: var(--rule2); }
.menu .mi small { display: block; color: var(--ink2); font-size: 12.5px; line-height: 1.3; }
.menu .mi kbd { margin-left: auto; font: 12px var(--ui); color: var(--ink3); }
.menu hr { border: 0; border-top: 1px solid var(--rule2); margin: 5px 0; }
.menu .hd { font: 600 12.5px var(--cond); color: var(--ink3); padding: 6px 10px 2px; }
.menu .pad { padding: 8px 10px; font-size: 13.5px; color: var(--ink2); }
.menu .pad p { margin: 0 0 8px; }
.menu .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 10px; }
.menu .row select { height: 30px; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); padding: 0 6px; }
.menu .mi.sel { color: var(--pen); font-weight: 500; }
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 20, .45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.dlg { background: var(--paper); border-radius: 10px; box-shadow: var(--shadow); width: min(720px, 100%); max-height: min(86vh, 800px); display: flex; flex-direction: column; }
.dlg.sm { width: min(440px, 100%); }
.dlg header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; border-bottom: 1px solid var(--rule2); }
.dlg h2 { font: 600 20px/1.2 var(--cond); margin: 0; }
.dlg .dbody { padding: 12px 18px 16px; overflow: auto; }
.dlg .dfoot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 10px 18px 14px; }
.help h3 { font: 600 15px var(--cond); color: var(--ink2); margin: 14px 0 4px; }
.help h3:first-child { margin-top: 2px; }
.help .hr { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 4px 16px; padding: 5px 0; border-top: 1px solid var(--rule2); align-items: baseline; }
.help code { font: 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
.help .hr span { color: var(--ink2); font-size: 13.5px; }
.toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 8px; font-size: 14px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

// ---------- the optional advanced solver (SymPy, loaded on request) ----------
const PYU = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
const BRIDGE = "# iCalPad advanced solver bridge. Runs inside Pyodide in a web worker.\n# The page sends an operation and its arguments as JSON expression trees;\n# SymPy does the work and the answer goes back as a JSON tree.\nimport json\nfrom sympy import *\nfrom sympy.core.function import AppliedUndef\nfrom sympy.core.relational import Relational\nfrom sympy.logic.boolalg import And, Or, Not, BooleanTrue, BooleanFalse\n\n_FN = {'sin': sin, 'cos': cos, 'tan': tan, 'asin': asin, 'acos': acos, 'atan': atan, 'sinh': sinh, 'cosh': cosh,\n       'tanh': tanh, 'asinh': asinh, 'acosh': acosh, 'atanh': atanh, 'ln': log, 'abs': Abs, 'sign': sign,\n       'floor': floor, 'ceil': ceiling, 'max': Max, 'min': Min, 'erf': erf, 'atan2': atan2, 'factorial': factorial,\n       'and': And, 'or': Or, 'not': Not}\n_BACK = {'log': 'ln', 'Abs': 'abs', 'ceiling': 'ceil', 'Max': 'max', 'Min': 'min'}\n_CONST = {'%pi': pi, '%e': E, '%i': I, '%inf': oo}\n_REL = {'=': Eq, '!=': Ne, '<': Lt, '>': Gt, '<=': Le, '>=': Ge}\n_RELB = {'==': '=', '!=': '!=', '<': '<', '>': '>', '<=': '<=', '>=': '>='}\n\n\ndef _dec(j, ctx):\n    t = j['t']\n    if t == 'n':\n        return Rational(int(j['n']), int(j['d']))\n    if t == 'f':\n        return Float(j['v'])\n    if t == 'b':\n        return true if j['v'] else false\n    if t == 's':\n        n = j['name']\n        if n in _CONST:\n            return _CONST[n]\n        if n not in ctx['syms']:\n            # engineering quantities are taken as positive; the unknown being solved for is left free\n            ctx['syms'][n] = Symbol(n) if n in ctx['free'] else Symbol(n, positive=True)\n        return ctx['syms'][n]\n    if t == 'm':\n        return Matrix([[_dec(x, ctx) for x in r] for r in j['r']])\n    a = [_dec(x, ctx) for x in j.get('a', [])]\n    if t == '+':\n        return Add(*a)\n    if t == '*':\n        return Mul(*a)\n    if t == '^':\n        return Pow(a[0], a[1])\n    if t == 'rel':\n        return _REL[j['op']](a[0], a[1])\n    if t == ' :\n        return {'t': '^', 'a': [{'t': 's', 'name': '%e'}, _enc(e.args[0])]}\n    if isinstance(e, Relational):\n        return {'t': 'rel', 'op': _RELB[e.rel_op], 'a': [_enc(e.lhs), _enc(e.rhs)]}\n    if isinstance(e, Piecewise):\n        return {'t': 'pw', 'a': [[_enc(x), _enc(c)] for x, c in e.args]}\n    if isinstance(e, Derivative):\n        r = _enc(e.expr)\n        for v, n in e.variable_count:\n            r = {'t': 'fn', 'name': 'diff', 'a': [r, _enc(v), _enc(Integer(n))]}\n        return r\n    if isinstance(e, AppliedUndef):\n        return {'t': 'fn', 'name': '@' + e.func.__name__, 'a': [_enc(x) for x in e.args]}\n    if isinstance(e, (And, Or, Not)):\n        return {'t': 'fn', 'name': type(e).__name__.lower(), 'a': [_enc(x) for x in e.args]}\n    if isinstance(e, (Integral, Sum, Limit)) or e.has(S.NaN, S.ComplexInfinity):\n        raise ValueError('no closed form')\n    if e.is_Function:\n        n = type(e).__name__\n        return {'t': 'fn', 'name': _BACK.get(n, n), 'a': [_enc(x) for x in e.args]}\n    raise ValueError('cannot write ' + type(e).__name__)\n\n\ndef _names(j, out):\n    if j['t'] == 's':\n        out.add(j['name'])\n    for x in j.get('a', []):\n        _names(x, out)\n    for r in j.get('r', []):\n        for x in r:\n            _names(x, out)\n    return out\n\n\ndef icp_run(op, js):\n    args = json.loads(js)\n    ctx = {'syms': {}, 'free': set()}\n    if op in ('solve', 'limit') and len(args) > 1:\n        _names(args[1], ctx['free'])\n    A = [_dec(a, ctx) for a in args]\n    if op == 'integrate':\n        r = integrate(A[0], A[1]) if len(A) == 2 else integrate(A[0], (A[1], A[2], A[3]))\n        if r.has(Integral):\n            return 'null'\n    elif op == 'solve':\n        eqs, vs = list(A[0]), list(A[1])\n        sol = solve(eqs if len(eqs) > 1 else eqs[0], vs, dict=True)\n        if not sol:\n            return 'null'\n        if len(vs) == 1:\n            vals = [s[vs[0]] for s in sol if vs[0] in s]\n            if not vals:\n                return 'null'\n            r = vals[0] if len(vals) == 1 else Matrix(vals)\n        else:\n            rows = [[s.get(v, v) for v in vs] for s in sol]\n            r = Matrix(rows[0]) if len(rows) == 1 else Matrix(rows)\n    elif op == 'limit':\n        r = limit(A[0], A[1], A[2])\n    elif op == 'simplify':\n        r = simplify(A[0])\n    elif op == 'factor':\n        r = factor(A[0])\n    elif op == 'apart':\n        r = apart(A[0], A[1]) if len(A) > 1 else apart(A[0])\n    elif op == 'summation':\n        r = summation(A[0], (A[1], A[2], A[3]))\n    elif op == 'laplace':\n        r = laplace_transform(A[0], A[1], A[2], noconds=True)\n    elif op == 'ilaplace':\n        r = inverse_laplace_transform(A[0], A[1], A[2])\n    elif op == 'dsolve':\n        sol = dsolve(A[0], A[1])\n        r = sol.rhs if isinstance(sol, Equality) else Matrix([s.rhs for s in sol])\n    else:\n        raise ValueError('unknown operation ' + op)\n    return json.dumps(_enc(r))\n";
const Adv = { state: 'off', note: '', worker: null, cache: new Map(), wait: new Map(), seq: 0, dog: 0, loadDog: 0 };
function syncSolver() {

  $('#solver-lbl').textContent = Adv.state === 'ready' ? 'Advanced solver on' : Adv.state === 'loading' ? (Adv.note || 'Loading solver…') : Adv.state === 'failed' ? 'Solver did not load' : 'Built-in solver';
}

function advStart() {

  Adv.state = 'loading'; Adv.note = 'Downloading solver…'; syncSolver();
  const src = `importScripts(${JSON.stringify(PYU + 'pyodide.js')});
let run = null;
const ready = (async () => {
  const py = await loadPyodide({ indexURL: ${JSON.stringify(PYU)} });

      if (Adv.wait.size) armDog(); recalcSoon();
    }
  };
  Adv.loadDog = setTimeout(() => { if (Adv.state === 'loading') advFail('The download took too long.'); }, 180000);
}
function armDog() {                         // a calculation that runs too long is abandoned and the solver restarted
  clearTimeout(Adv.dog);
  Adv.dog = setTimeout(() => {
    for (const k of Adv.wait.values()) Adv.cache.set(k, null);
    Adv.wait.clear(); if (Adv.worker) Adv.worker.terminate(); Adv.worker = null; Adv.state = 'off';
    toast('The advanced solver gave up on one line after 60 seconds.'); advStart(); recalc();
  }, 60000);
}
Core.C.adv = (op, args) => {
  if (Adv.state === 'loading') throw new Core.Pending();
  if (Adv.state !== 'ready') return null;
  const k = op + '|' + args.map(Core.key).join('|');
  if (Adv.cache.has(k)) return Adv.cache.get(k);
  if (![...Adv.wait.values()].includes(k)) { const id = ++Adv.seq; Adv.wait.set(id, k); Adv.worker.postMessage({ id, op, args: JSON.stringify(args) }); armDog(); }
  throw new Core.Pending();
};
function advStop() { if (Adv.worker) Adv.worker.terminate(); Adv.worker = null; Adv.state = 'off'; Adv.wait.clear(); LS.set('icalpad.adv', false); syncSolver(); recalc(); }
function solverMenu(anchor) {
  const st = Adv.state;
  const head = `<div class="pad"><p><b>Built-in solver.</b> Always on, instant, works offline. Handles everyday algebra, calculus, units and matrices.</p><p style="margin:0"><b>Advanced solver.</b> A full computer algebra system (SymPy) for harder integrals, nonlinear systems, differential equations and Laplace transforms. It is a one-time download of about 20 MB that your browser keeps for next time.</p>${st === 'failed' ? `<p style="margin:8px 0 0;color:var(--ng)">${esc(Adv.note)} It needs an internet connection and a page that is allowed to reach cdn.jsdelivr.net.</p>` : ''}</div>`;
  openMenu(anchor, [{ html: head }, '-',
    st === 'ready' ? { label: 'Turn off the advanced solver', act: advStop }
      : st === 'loading' ? { label: 'Cancel the download', act: advStop }
      : { label: st === 'failed' ? 'Try the download again' : 'Turn on the advanced solver', note: 'Downloads about 20 MB', act: advStart }]);
}

// ---------- settings, help ----------
function applyTheme() {
  const r = document.documentElement;
  if (S.set.theme === 'auto') { if (applyTheme.orig) r.setAttribute('data-theme', applyTheme.orig); else r.removeAttribute('data-theme'); }
  else r.setAttribute('data-theme', S.set.theme);
  themeCache = null;
}
applyTheme.orig = document.documentElement.getAttribute('data-theme');
function settingsMenu(anchor) {
  const opt = (v, cur, label) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${label}</option>`;
  openMenu(anchor, [{ html: `<div class="row"><label for="set-sig">Digits shown</label><select id="set-sig">${[3, 4, 5, 6, 8].map(n => opt(n, S.set.sig, n)).join('')}</select></div>
    <div class="row"><label for="set-sys">Units for answers</label><select id="set-sys">${opt('auto', S.set.system, 'Follow the worksheet')}${opt('SI', S.set.system, 'SI')}${opt('US', S.set.system, 'US customary')}</select></div>
    <div class="row"><label for="set-th">Appearance</label><select id="set-th">${opt('auto', S.set.theme, 'Match my device')}${opt('light', S.set.theme, 'Light')}${opt('dark', S.set.theme, 'Dark')}</select></div>` }], m => {
    const on = (id, f) => m.querySelector(id).addEventListener('change', e => { f(e.target.value); LS.set('icalpad.set', S.set); recalc(); });
    on('#set-sig', v => { S.set.sig = +v; }); on('#set-sys', v => { S.set.system = v; }); on('#set-th', v => { S.set.theme = v; applyTheme(); });
  });
}
function helpDialog() {
  dialog({ title: 'How iCalPad works', body: `<div class="help">${HELP.map(([h, rows]) => `<h3>${esc(h)}</h3>${rows.map(([c, d]) => `<div class="hr"><code>${esc(c)}</code><span>${esc(d)}</span></div>`).join('')}`).join('')}
    <h3>Keys</h3><div class="hr"><code>Enter</code><span>New line below</span></div><div class="hr"><code>↑ ↓</code><span>Previous or next line</span></div><div class="hr"><code>Esc</code><span>Finish editing</span></div><div class="hr"><code>Alt while dragging</code><span>Move without snapping</span></div>
    <h3>LaTeX</h3><div class="hr"><code>\\frac{w L^2}{8} =</code><span>Any line can be typed or pasted as LaTeX</span></div><div class="hr"><code>Copy as LaTeX</code><span>In a line's menu, and under File for the whole page</span></div></div>` });
}

// ---------- wiring ----------
$('#b-side').innerHTML = ic('side'); $('#b-undo').innerHTML = ic('undo'); $('#b-redo').innerHTML = ic('redo'); $('#b-undo2').innerHTML = ic('undo');
$('#b-help').innerHTML = ic('help'); $('#b-set').innerHTML = ic('set'); $('#b-more').innerHTML = ic('more');
const ADD_LABEL = { math: 'Math', text: 'Note', plot: 'Plot', picture: 'Picture', sketch: 'Sketch' };
function addKind(k) { if (k === 'picture') $('#f-img').click(); else addRegion(k); }
for (const b of $$('[data-add]')) { b.innerHTML = ic('plus') + ADD_LABEL[b.dataset.add]; b.addEventListener('click', () => addKind(b.dataset.add)); b.addEventListener('pointerdown', e => e.preventDefault()); }
$('#b-side').addEventListener('click', () => toggleSide());
$('#b-undo').addEventListener('click', undo); $('#b-undo2').addEventListener('click', undo); $('#b-redo').addEventListener('click', redo);
$('#b-ex').addEventListener('click', e => openMenu(e.currentTarget, [{ hd: 'Open an example worksheet' }, ...exampleItems()]));
$('#b-file').addEventListener('click', e => openMenu(e.currentTarget, fileItems()));
$('#b-solver').addEventListener('click', e => solverMenu(e.currentTarget));
$('#b-set').addEventListener('click', e => settingsMenu(e.currentTarget));
$('#b-help').addEventListener('click', helpDialog);
$('#b-more').addEventListener('click', e => {
  const a = e.currentTarget;
  openMenu(a, [{ label: 'Add a sketch', act: () => addRegion('sketch') }, { label: 'Redo', act: redo }, '-', ...fileItems(), '-',
    { label: Adv.state === 'ready' ? 'Advanced solver is on' : 'Solver…', act: () => setTimeout(() => solverMenu(a), 0) },
    { label: 'How iCalPad works', act: helpDialog }, { label: 'Settings…', act: () => setTimeout(() => settingsMenu(a), 0) }]);
});
for (const [id, k] of [['#f-title', 'title'], ['#f-by', 'by'], ['#f-date', 'date'], ['#f-sheet', 'sheet']]) $(id).addEventListener('input', e => { S.doc[k] = e.target.value; touch(); });
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, ty = typing();
  if (e.key === 'Escape') { closeMenu(); if (!ty) setActive(null); }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(fileName() + '.json', docJson()); }
  if (mod && e.key.toLowerCase() === 'z' && !ty) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  if (mod && e.key.toLowerCase() === 'y' && !ty) { e.preventDefault(); redo(); }
  if (!ty && !mod && !e.altKey && !menuEl && !$('.scrim')) {
    if ((e.key === 'Delete' || e.key === 'Backspace') && S.active && region(S.active) && ['plot', 'image'].includes(region(S.active).type)) { e.preventDefault(); removeRegion(S.active); commit(); }
    else if (FREE && S.cursor && e.key.length === 1 && e.key !== ' ') {                 // click a spot, then just type
      e.preventDefault();
      if (e.key === '"') addRegion('text', { at: { ...S.cursor } }); else { const rg = addRegion('math', { at: { ...S.cursor }, src: e.key === ':' ? ':=' : e.key }); const inp = els.get(rg.id).querySelector('.src'); inp.setSelectionRange(inp.value.length, inp.value.length); recalcSoon(); }
    }
  }
});
let wasFree = FREE;
/* Right-click opens iCalPad's own menu. Text boxes keep the browser's menu (spelling, copy, paste),
   and Shift + right-click always gives the browser's menu. */
const pointAnchor = (x, y) => ({ getBoundingClientRect: () => ({ left: x, right: x, top: y, bottom: y, width: 0, height: 0 }), contains: () => false, hasAttribute: () => false, setAttribute() { /* not a button */ } });
async function pasteHere(at) {
  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      const items = await navigator.clipboard.read(), imgs = [];
      for (const it of items) { const t = it.types.find(x => /^image\/(png|jpeg|gif|webp)$/.test(x)); if (t) imgs.push(await it.getType(t)); }
      if (imgs.length) { addPictures(imgs, at); return; }
    }
    const t = await navigator.clipboard.readText();
    if (t && t.trim()) pasteText(t, at); else toast('The clipboard is empty.');
  } catch (e) { toast('This browser blocked reading the clipboard. Press Ctrl+V (⌘V on a Mac) to paste.'); }
}
desk.addEventListener('contextmenu', e => {
  if (e.shiftKey || e.target.closest('input, textarea, select, .menu')) return;
  e.preventDefault();
  const anchor = pointAnchor(e.clientX, e.clientY), rgEl = e.target.closest('.rg');
  if (rgEl && region(rgEl.dataset.id)) { const rg = region(rgEl.dataset.id); if (S.active !== rg.id) setActive(rg.id, false); regionMenu(rg, anchor); return; }
  let at;
  if (FREE && e.target.closest('#rgs')) { const p = canvasPt(e); at = { x: Math.max(0, snap(p.x - 4)), y: Math.max(0, snap(p.y - 20)), room: false }; setActive(null); setCursor(at); }
  const here = FREE && at ? ' here' : '';
  openMenu(anchor, [
    { label: 'Add math' + here, act: () => addRegion('math', at ? { at } : {}) },
    { label: 'Add a note' + here, act: () => addRegion('text', at ? { at } : {}) },
    { label: 'Add a plot' + here, act: () => addRegion('plot', at ? { at } : {}) },
    { label: 'Add a picture' + here + '…', act: () => { S.pendingAt = at || null; $('#f-img').click(); } },
    { label: 'Add a sketch' + here, act: () => addRegion('sketch', at ? { at } : {}) },
    '-',
    ...(navigator.clipboard && navigator.clipboard.readText ? [{ label: 'Paste' + here, kbd: 'Ctrl V', act: () => pasteHere(at) }] : []),
    { label: 'Undo', kbd: 'Ctrl Z', act: undo }, { label: 'Redo', act: redo },
    '-',
    { label: 'Copy the page as LaTeX', act: () => copyText(latexDoc(), 'LaTeX') },
  ]);
});
/* A stylus such as Apple Pencil: draws on a selected picture, and fingers no longer draw (palm rejection). */
function markPen() { if (!S.penSeen) { S.penSeen = true; document.body.classList.add('pen-mode'); } }
for (const t of ['pointerdown', 'pointermove']) document.addEventListener(t, e => { if (e.pointerType === 'pen') markPen(); }, { capture: true, passive: true });
window.addEventListener('resize', () => { closeMenu(); if (!narrow() !== wasFree) { wasFree = !narrow(); renderAll(); } });
if (window.ResizeObserver) new ResizeObserver(() => { for (const P of plots.values()) draw(P); }).observe($('#sheet'));

// ---------- start ----------
async function start(hot) {
  Object.assign(S.set, LS.get('icalpad.set') || {});
  applyTheme(); syncSolver();
  toggleSide(narrow() ? false : LS.get('icalpad.side') === true);
  await Promise.race([DB.open(), new Promise(r => setTimeout(r, 1200))]);
  let doc = null;
  try { doc = hot && hot.doc ? cleanDoc(hot.doc) : null; } catch (e) { doc = null; }
  if (!doc) { try { const saved = (await DB.get('doc')) || LS.get('icalpad.doc'); doc = saved ? cleanDoc(saved) : null; } catch (e) { doc = null; } }
  loadDoc(doc && doc.regions.length ? doc : docFrom(EXAMPLES[0].s, EXAMPLES[0].title), true);
  if (LS.get('icalpad.adv') === true) advStart();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.doc.auto && S.hpos <= 0) { autoLayout(); persist(); } for (const P of plots.values()) { P.range = null; draw(P); } });
}
const hotApi = window.claude && window.claude.hot;
if (hotApi && hotApi.snapshot) hotApi.snapshot(() => ({ doc: S.doc }));
if (hotApi && hotApi.ready) hotApi.ready(start); else start((hotApi && hotApi.data) || {});
window.iCalPad = { state: S, Core, Adv };
})();

</script>
